name: Loro
options:
  bundleIdPrefix: cl.manulit0
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
packages:
  LoroCore:
    path: Packages/LoroCore
targets:
  Loro:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: LoroCore
        product: LoroCore
      - package: LoroCore
        product: LoroKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Loro
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        CFBundleDisplayName: Loro
        CFBundleIdentifier: cl.manulit0.loro
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Loro necesita el micrófono para transcribir lo que dictas. Todo se procesa en este Mac.
        NSSpeechRecognitionUsageDescription: Loro usa el reconocimiento de voz de Apple como uno de sus motores locales.
        NSHumanReadableCopyright: © 2026 Manuel Horwitz
    entitlements:
      path: App/Loro.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.manulit0.loro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_SWIFT_FLAGS: -enable-upcoming-feature InferIsolatedConformances
schemes:
  Loro:
    build:
      targets:
        Loro: all
    run:
      config: Debug
